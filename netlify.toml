[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# L'interface d'administration ne doit pas être indexée par Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Anciennes adresses redirigées vers les nouvelles
[[redirects]]
  from = "/actualites/exemple-communique/"
  to = "/actualites/communique-grande-finale-aril/"
  status = 301

[[redirects]]
  from = "/nous-soutenir/"
  to = "/#soutenir"
  status = 301

[[redirects]]
  from = "/rc/nous-soutenir/"
  to = "/rc/#soutenir"
  status = 301
