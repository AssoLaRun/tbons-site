dget: string, required: false }, { name: retour_actus, label: "← Actualités", widget: string, required: false }, { name: lire_article, label: "Lire l'article complet →", widget: string, required: false }, { name: photo_a_ajouter, label: "Photo à ajouter", widget: string, required: false }, { name: pied_association, label: "L'association", widget: string, required: false }, { name: pied_partenaires, label: "Partenaires", widget: string, required: false }, { name: pied_soutenir, label: "Nous soutenir", widget: string, required: false }, { name: pied_contact, label: "Contact", widget: string, required: false }, { name: pied_ecrire, label: "Nous écrire", widget: string, required: false }, { name: pied_kit, label: "Kit presse", widget: string, required: false }, { name: pied_suivre, label: "Suivez-nous", widget: string, required: false }, { name: pied_loi, label: "Association loi 1901", widget: string, required: false }, { name: mentions, label: "Mentions légales", widget: string, required: false }, { name: actions_chapo, label: "Ce que nous faisons, concrètement.", widget: string, required: false }, { name: baseline, label: "Association loi 1901 · La Réunion", widget: string, required: false }, { name: description, label: "Association de jeunes réunionnais pour l'engagement citoyen et contre les discriminations, fondée en 2023 à Sainte-Clotilde.", widget: string, required: false }] }

  - name: actions_rc
    label: "Nout bann aksyon (KR)"
    label_singular: "aksyon"
    folder: src/rc/actions
    create: true
    slug: "{{slug}}"
    identifier_field: titre
    summary: "{{titre}}"
    fields:
      - { name: titre, label: "Titre en créole", widget: string, hint: "Le nom du fichier doit être identique à celui de la fiche française (ex. aril)." }
      - { name: resume, label: "Résumé", widget: text }
      - { name: image_alt, label: "Description de la photo", widget: string, required: false }
      - { name: brouillon, label: "Brouillon (non publié)", widget: boolean, default: false, required: false }
      - { name: body, label: "Présentation détaillée", widget: markdown }

  - name: pages_rc
    label: "Bann paz (KR)"
    label_singular: "paz"
    folder: src/rc/pages
